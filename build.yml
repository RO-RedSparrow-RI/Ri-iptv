name: Build master IPTV playlist
on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"
  push:
    paths:
      - "build_playlist.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate playlist
        run: python build_playlist.py
      - name: Publish playlist file
        run: |
          mkdir -p docs
          cp playlist.m3u docs/playlist.m3u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u public/playlist.m3u
          git diff --cached --quiet || git commit -m "Update master IPTV playlist"
          git push
